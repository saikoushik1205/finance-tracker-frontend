<nav class="navbar glass-card">
  <div class="navbar-container">
    <div class="navbar-brand">
      <a routerLink="/dashboard" class="brand-link">
        <div class="brand-icon-wrapper">
          <span class="brand-icon">💰</span>
        </div>
        <div class="brand-text-group">
          <span class="brand-text">FinTrack</span>
          <span class="brand-badge">PRO</span>
        </div>
      </a>
    </div>

    <div class="navbar-menu">
      <a routerLink="/dashboard" routerLinkActive="active" class="nav-link">
        <span class="nav-icon">📊</span>
        <span class="nav-label">Dashboard</span>
      </a>

      <a routerLink="/lending" routerLinkActive="active" class="nav-link">
        <span class="nav-icon">💸</span>
        <span class="nav-label">Lending</span>
      </a>

      <a routerLink="/borrowing" routerLinkActive="active" class="nav-link">
        <span class="nav-icon">💳</span>
        <span class="nav-label">Borrowing</span>
      </a>

      <a routerLink="/earnings" routerLinkActive="active" class="nav-link">
        <span class="nav-icon">💵</span>
        <span class="nav-label">Earnings</span>
      </a>

      <a routerLink="/expenses" routerLinkActive="active" class="nav-link">
        <span class="nav-icon">🧾</span>
        <span class="nav-label">Expenses</span>
      </a>
    </div>

    @if (currentUser) {
      <div class="navbar-user">
        <button class="user-button" (click)="toggleUserMenu()" type="button" aria-label="User menu">
          @if (currentUser.photoURL) {
            <img
              [src]="currentUser.photoURL"
              [alt]="currentUser.displayName"
              class="user-avatar"
            />
          } @else {
            <div class="user-avatar-placeholder">
              {{
                currentUser.displayName.charAt(0) ||
                  currentUser.email.charAt(0) ||
                  "U"
              }}
            </div>
          }
          <span class="user-name">
            {{ currentUser.displayName || currentUser.email }}
          </span>
          <svg
            class="chevron"
            [class.rotate]="showUserMenu"
            width="14"
            height="14"
            viewBox="0 0 16 16"
            fill="currentColor"
          >
            <path
              d="M4.427 6.573l3.396 3.396 3.396-3.396a.75.75 0 111.06 1.06l-3.925 3.926a.75.75 0 01-1.061 0L3.367 7.633a.75.75 0 011.06-1.06z"
            />
          </svg>
        </button>

        @if (showUserMenu) {
          <div class="user-menu glass-card">
            <div class="user-menu-header">
              <span class="user-menu-email">{{ currentUser.email }}</span>
            </div>
            <a
              routerLink="/profile"
              class="menu-item"
              (click)="showUserMenu = false"
            >
              <span class="menu-icon">👤</span>
              <span>Profile & Settings</span>
            </a>
            <div class="menu-divider"></div>
            <button class="menu-item logout" (click)="logout()" type="button">
              <span class="menu-icon">🚪</span>
              <span>Logout</span>
            </button>
          </div>
        }
      </div>
    }
  </div>
</nav>
